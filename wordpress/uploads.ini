; Product detail pages host locally uploaded video, so the stock 2M cap is far
; too low. Keep post_max_size >= upload_max_filesize or PHP silently drops the
; request body before WordPress ever sees the file.
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
