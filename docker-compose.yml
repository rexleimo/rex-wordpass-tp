services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        // Keep local URLs in the database while allowing temporary Cloudflare previews.
        $$tokraft_tunnel_host = $$_SERVER['HTTP_HOST'] ?? '';
        if (!defined('WP_HOME') && preg_match('/^[a-z0-9-]+\.trycloudflare\.com$$/i', $$tokraft_tunnel_host)) {
          $$_SERVER['HTTPS'] = 'on';
          define('WP_HOME', 'https://' . $$tokraft_tunnel_host);
          define('WP_SITEURL', 'https://' . $$tokraft_tunnel_host);
        }
    volumes:
      - wordpress_data:/var/www/html
      # Mount the entire product catalog so one local WordPress admin can
      # install and switch between independently shippable themes.
      - ./themes:/var/www/html/wp-content/themes
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  db_data:
  wordpress_data:
